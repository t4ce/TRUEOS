<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-label="Three GPU compiler paths, three different contracts"><defs><marker id="cpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2363ad"/></marker><marker id="compiler" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7551ae"/></marker><marker id="gpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16764d"/></marker><marker id="memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007e88"/></marker><marker id="proposal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b47710"/></marker><marker id="error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb3e40"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/></marker></defs><rect width="1600" height="1040" fill="#fff"/><text x="40" y="39" font-family="Arial,sans-serif" font-size="14" fill="#65758b" font-weight="700">TRUEOS × ODIN-SON  /  EXECUTION ATLAS</text><text x="40" y="83" font-family="Arial,sans-serif" font-size="33" fill="#16283f" font-weight="700">Three GPU compiler paths, three different contracts</text><text x="40" y="117" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">The handwritten encoder remains valuable. Backend reuse and runtime integration are separate questions.</text><rect x="40" y="160" width="465" height="125" rx="12" fill="#f4effb" stroke="#7551ae" stroke-width="2"/><text x="58" y="191" font-family="Arial,sans-serif" font-size="20" fill="#7551ae" font-weight="700">A · Native pixel math body</text><text x="58" y="221" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Ordinary f32 / bool math; bounded source loops</text><text x="58" y="246" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">unrolled by frontend.</text><rect x="570" y="160" width="470" height="125" rx="12" fill="#f4effb" stroke="#7551ae" stroke-width="2"/><text x="588" y="191" font-family="Arial,sans-serif" font-size="20" fill="#7551ae" font-weight="700">B · Native scalar-call kernel</text><text x="588" y="221" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Two f32 arguments → one f32 result. CPU stub</text><text x="588" y="246" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">embeds .gpu.xelp code.</text><rect x="1105" y="160" width="455" height="125" rx="12" fill="#f4effb" stroke="#7551ae" stroke-width="2"/><text x="1123" y="191" font-family="Arial,sans-serif" font-size="20" fill="#7551ae" font-weight="700">C · Legacy boids command DSL</text><text x="1123" y="221" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">gpu_add_scaled produces four-word commands;</text><text x="1123" y="246" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">optional fixed-register EU body export.</text><rect x="40" y="343" width="465" height="155" rx="12" fill="#f4effb" stroke="#7551ae" stroke-width="2"/><text x="58" y="374" font-family="Arial,sans-serif" font-size="20" fill="#7551ae" font-weight="700">Shared BAC machinery</text><text x="58" y="404" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Typed GPU ops → BAC/SSA → target lowering →</text><text x="58" y="429" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">register allocation → SIMD8 arithmetic body;</text><text x="58" y="454" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">r1/r2 input, r4 output.</text><rect x="570" y="343" width="470" height="155" rx="12" fill="#f4effb" stroke="#7551ae" stroke-width="2"/><text x="588" y="374" font-family="Arial,sans-serif" font-size="20" fill="#7551ae" font-weight="700">Shared BAC + kernel tail</text><text x="588" y="404" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Same math compiler, plus result-store / fence /</text><text x="588" y="429" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">EOT convention. Runtime call is generated into</text><text x="588" y="454" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">CPU code.</text><rect x="1105" y="343" width="455" height="155" rx="12" fill="#f4effb" stroke="#7551ae" stroke-width="2"/><text x="1123" y="374" font-family="Arial,sans-serif" font-size="20" fill="#7551ae" font-weight="700">Separate legacy lowering</text><text x="1123" y="404" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Fixed r16..r20 boids arithmetic export; legacy</text><text x="1123" y="429" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">body has no shared scalar-path allocation.</text><text x="1123" y="454" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Four-word DSL ≠ native EU encoding.</text><polyline points="272,285 272,343" fill="none" stroke="#7551ae" stroke-width="2.5" marker-end="url(#compiler)"/><polyline points="805,285 805,343" fill="none" stroke="#7551ae" stroke-width="2.5" marker-end="url(#compiler)"/><polyline points="1332,285 1332,343" fill="none" stroke="#7551ae" stroke-width="2.5" marker-end="url(#compiler)"/><rect x="40" y="555" width="465" height="185" rx="12" fill="#edf8f0" stroke="#16764d" stroke-width="2"/><text x="58" y="586" font-family="Arial,sans-serif" font-size="20" fill="#16764d" font-weight="700">Current integration + recorded proof</text><text x="58" y="616" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">UI4 bridge + runtime envelope; eight useful</text><text x="58" y="641" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">pixel lanes; GPU writes surface. ADL-S matching</text><text x="58" y="666" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">image hashes recorded on 22 Oct 2026. [S7–S10]</text><rect x="570" y="555" width="470" height="185" rx="12" fill="#fff6e3" stroke="#b47710" stroke-width="2" stroke-dasharray="9 5"/><text x="588" y="586" font-family="Arial,sans-serif" font-size="20" fill="#b47710" font-weight="700">Current ABI gap</text><text x="588" y="616" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Compiler requests trueos_cabi_vgpu_call_f32_v1,</text><text x="588" y="641" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">marked retired by current loader. Host exposes</text><text x="588" y="666" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">handle-based ...vgpu_scalar_f32_v1 instead. [S6,</text><text x="588" y="691" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">S11]</text><rect x="1105" y="555" width="455" height="185" rx="12" fill="#fff6e3" stroke="#b47710" stroke-width="2" stroke-dasharray="9 5"/><text x="1123" y="586" font-family="Arial,sans-serif" font-size="20" fill="#b47710" font-weight="700">Transport still needs tracing</text><text x="1123" y="616" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Optional EU body is a fragment. Legacy CPU</text><text x="1123" y="641" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">object retains its command dispatch route;</text><text x="1123" y="666" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">vFile:compute-boids is not established by this</text><text x="1123" y="691" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">review.</text><polyline points="272,498 272,555" fill="none" stroke="#65758b" stroke-width="2.5" marker-end="url(#gray)"/><polyline points="805,498 805,555" fill="none" stroke="#65758b" stroke-width="2.5" marker-end="url(#gray)"/><polyline points="1332,498 1332,555" fill="none" stroke="#65758b" stroke-width="2.5" marker-end="url(#gray)"/><rect x="40" y="792" width="1520" height="134" rx="12" fill="#edf8f0" stroke="#16764d" stroke-width="2"/><text x="58" y="823" font-family="Arial,sans-serif" font-size="20" fill="#16764d" font-weight="700">What “scalar source” means here</text><text x="58" y="853" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">SIMD8 arithmetic is already emitted. Pixel body inputs vary across all eight elements; scalar-call ABI exposes one active result lane. Wider batching needs</text><text x="58" y="878" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">invocation IDs, memory access and an explicit ABI. 16-byte uncompacted encoding says how bytes are stored, not how many useful data elements execute.</text><path d="M40 951 H1560" stroke="#dce4ec"/><rect x="42" y="970" width="15" height="15" rx="3" fill="#2363ad"/><text x="65" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">CPU / host</text><rect x="220" y="970" width="15" height="15" rx="3" fill="#7551ae"/><text x="243" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Compiler</text><rect x="391" y="970" width="15" height="15" rx="3" fill="#16764d"/><text x="414" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">GPU / driver</text><rect x="590" y="970" width="15" height="15" rx="3" fill="#007e88"/><text x="613" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Memory / data</text><rect x="800" y="970" width="15" height="15" rx="3" fill="#b47710"/><text x="823" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Dashed: proposed or gap</text><rect x="1135" y="970" width="15" height="15" rx="3" fill="#bb3e40"/><text x="1158" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Failure / quarantine</text><text x="40" y="1018" font-family="Arial,sans-serif" font-size="13" fill="#30445b" font-weight="400">03 / 06    •    S6–S11, S13 • A hardware result for A does not establish B or C end-to-end.</text><text x="1130" y="1018" font-family="Arial,sans-serif" font-size="13" fill="#30445b" font-weight="400">Code review: 24 Oct 2026 • no new rig run</text></svg>