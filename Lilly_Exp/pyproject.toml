[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lilly-exp"
version = "0.1.0"
description = "Alpha-safe Practical-RIFE experiments for Lilly pixel-art frames"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2,<3",
    "Pillow>=11,<13",
    "scipy>=1.15,<2",
    "torch>=2.9,<2.13",
]

[project.scripts]
lilly-exp = "lilly_exp.cli:main"

[tool.setuptools.packages.find]
include = ["lilly_exp*"]

