[package]
name = "trueos-kokoro-dispatch"
version = "0.1.0"
edition = "2024"
license-file = "../../../LICENSE"
description = "Typed attributes and native CPU dispatch for sealed TRUEOS Kokoro AOT programs"

[lib]
path = "src/lib.rs"

[features]
default = []

[dependencies]
trueos-kokoro-aot = { path = "../aot", default-features = false }
trueos-kokoro-exec = { path = "../exec", default-features = false }
trueos-kokoro-memory = { path = "../memory", default-features = false }
trueos-kokoro-scalar = { path = "../scalar", default-features = false }
trueos-kokoro-f32 = { path = "../f32", default-features = false }
trueos-kokoro-layout = { path = "../layout", default-features = false }
trueos-kokoro-gemm = { path = "../gemm", default-features = false }
trueos-kokoro-conv = { path = "../conv", default-features = false }
trueos-kokoro-lstm = { path = "../lstm", default-features = false }
trueos-kokoro-duration = { path = "../duration", default-features = false }
trueos-kokoro-resize = { path = "../resize", default-features = false }
trueos-kokoro-stft = { path = "../stft", default-features = false }
trueos-ttstt-cpu = { path = "../../trueos-ttstt-cpu", default-features = false }
