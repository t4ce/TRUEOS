[package]
name = "trueos-lfm25-cpu"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"

[dependencies]
half = { path = "../../vendor/half-2.7.1", default-features = false }
libm = { version = "0.2", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
trueos-lfm25-model = { path = "../trueos-lfm25-model" }

[[bin]]
name = "lfm25-tokenizer-seal"
