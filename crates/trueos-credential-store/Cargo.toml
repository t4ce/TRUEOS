[package]
name = "trueos-credential-store"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"

[dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "zeroize"] }
# Enable expanded AES key cleanup even when built independently of the kernel.
aes = { version = "0.8", default-features = false, features = ["zeroize"] }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
