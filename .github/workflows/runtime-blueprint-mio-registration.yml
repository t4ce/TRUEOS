name: Materialize Blueprint Mio registration convergence

on:
  push:
    branches:
      - runtime/blueprint-mio-registration
    paths:
      - tools/apply_blueprint_mio_registration.py
      - .github/workflows/runtime-blueprint-mio-registration.yml
  pull_request:
    branches:
      - true
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: runtime-blueprint-mio-registration
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'push' || github.head_ref == 'runtime/blueprint-mio-registration'
    runs-on: ubuntu-latest
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@v4
        with:
          ref: runtime/blueprint-mio-registration
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize VM-lane wait and Mio registration
        run: |
          set -euo pipefail
          python3 tools/apply_runtime_blueprint_wait_marriage.py
          python3 tools/apply_blueprint_mio_registration.py
          rm tools/apply_runtime_blueprint_wait_marriage.py
          rm tools/apply_blueprint_mio_registration.py
          rm .github/workflows/runtime-blueprint-wait-marriage.yml
          rm .github/workflows/runtime-blueprint-mio-registration.yml
          cargo fmt --all
          git diff --check

      - name: Commit source-only convergence
        run: |
          set -euo pipefail
          git config user.name "TRUEOS runtime convergence"
          git config user.email "runtime-convergence@users.noreply.github.com"
          git add -A
          git commit -m "runtime: converge Blueprint Mio on VM-lane readiness"
          git push origin HEAD:runtime/blueprint-mio-registration
