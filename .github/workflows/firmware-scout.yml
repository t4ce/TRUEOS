name: FirmwareScout HII capture

on:
  pull_request:
    paths:
      - "tools/firmware-scout/**"
      - "tools/check-bios-schema-boundary.py"
      - "src/shell2/cmds/bios_*.rs"
      - "src/shell2/cmds/bios_*/**"
      - "src/shell2/cmds/tlb_hfi_dump.rs"
      - "src/shell2/cmds/mod.rs"
      - "src/shell2/shell2_cmd.rs"
      - ".github/workflows/firmware-scout.yml"
  push:
    branches:
      - true
    paths:
      - "tools/firmware-scout/**"
      - "tools/check-bios-schema-boundary.py"
      - "src/shell2/cmds/bios_*.rs"
      - "src/shell2/cmds/bios_*/**"
      - "src/shell2/cmds/tlb_hfi_dump.rs"
      - "src/shell2/cmds/mod.rs"
      - "src/shell2/shell2_cmd.rs"
      - ".github/workflows/firmware-scout.yml"

permissions:
  contents: read

env:
  TRUEOS_BLUEPRINTS_REV: 973d1fbf1fde47e535b2b3d90f4ada6491eb1e6b

jobs:
  firmware-scout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust components
        run: |
          rustup toolchain install nightly-2026-07-10 --profile minimal --component rust-src,rustfmt
          rustup target add --toolchain nightly-2026-07-10 x86_64-unknown-uefi
      - name: Report FirmwareScout formatting drift
        continue-on-error: true
        working-directory: tools/firmware-scout
        run: cargo +nightly-2026-07-10 fmt -- --check
      - name: Build FirmwareScout PE32+ application
        working-directory: tools/firmware-scout
        run: cargo +nightly-2026-07-10 build --locked --release

  kernel-integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install pinned Rust components
        run: rustup toolchain install nightly-2026-07-10 --profile minimal --component rust-src
      - name: Checkout Blueprint path dependencies
        run: |
          set -euo pipefail
          mkdir -p bld
          git init bld/TRUEOS-Blueprints
          git -C bld/TRUEOS-Blueprints remote add origin \
            https://github.com/t4ce/TRUEOS-Blueprints.git
          git -C bld/TRUEOS-Blueprints fetch --depth 1 origin \
            "${TRUEOS_BLUEPRINTS_REV}"
          git -C bld/TRUEOS-Blueprints checkout --detach FETCH_HEAD
          ln -s "${GITHUB_WORKSPACE}/bld/TRUEOS-Blueprints" \
            "${GITHUB_WORKSPACE}/../TRUEOS-Blueprints"
          test -f \
            "${GITHUB_WORKSPACE}/../TRUEOS-Blueprints/crates/log-os/Cargo.toml"
      - name: Verify read-only BIOS schema boundary
        run: python3 tools/check-bios-schema-boundary.py
      - name: Check TRUEOS kernel integration
        run: cargo +nightly-2026-07-10 check -p TRUEOS
