name: Materialize Blueprint VM-lane wait

# This branch-local workflow exists only long enough to materialize the source edits.
on:
  pull_request:
    branches:
      - true
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: runtime-blueprint-wait-marriage
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'runtime/blueprint-io-wait'
    runs-on: ubuntu-latest
    steps:
      - name: Check out convergence branch
        uses: actions/checkout@v4
        with:
          ref: runtime/blueprint-io-wait
          fetch-depth: 0
          persist-credentials: false

      - name: Apply the VM-lane wait convergence
        run: |
          set -euo pipefail
          python3 tools/apply_runtime_blueprint_wait_marriage.py
          rm tools/apply_runtime_blueprint_wait_marriage.py
          rm .github/workflows/runtime-blueprint-wait-marriage.yml
          git diff --check

      - name: Publish verified repository commits through the Contents API
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: runtime/blueprint-io-wait
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["BRANCH"]
          api = f"https://api.github.com/repos/{repository}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "trueos-runtime-convergence",
          }

          def request(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(api + endpoint, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req) as response:
                      body = response.read()
              except urllib.error.HTTPError as error:
                  detail = error.read().decode(errors="replace")
                  raise RuntimeError(f"GitHub {method} {endpoint}: {error.code}: {detail}") from error
              return json.loads(body) if body else None

          def metadata(path):
              encoded_path = urllib.parse.quote(path, safe="/")
              encoded_ref = urllib.parse.quote(branch, safe="")
              return request("GET", f"/contents/{encoded_path}?ref={encoded_ref}")

          def delete(path, message):
              current = metadata(path)
              result = request("DELETE", f"/contents/{urllib.parse.quote(path, safe='/')}", {
                  "message": message,
                  "sha": current["sha"],
                  "branch": branch,
              })
              print(f"deleted {path}: {result['commit']['sha']}")

          def update(path, message):
              current = metadata(path)
              content = base64.b64encode(Path(path).read_bytes()).decode()
              result = request("PUT", f"/contents/{urllib.parse.quote(path, safe='/')}", {
                  "message": message,
                  "content": content,
                  "sha": current["sha"],
                  "branch": branch,
              })
              print(f"updated {path}: {result['commit']['sha']}")

          # Remove the branch-local materializer first. Subsequent API commits no
          # longer contain this workflow, so they cannot recursively launch it.
          delete(
              ".github/workflows/runtime-blueprint-wait-marriage.yml",
              "runtime: remove VM-lane wait materializer",
          )
          delete(
              "tools/apply_runtime_blueprint_wait_marriage.py",
              "runtime: remove VM-lane wait materializer script",
          )

          updates = [
              ("src/wait.rs", "runtime: add VM-scoped async platform wait"),
              ("src/hv/vmcall.rs", "runtime: add Blueprint platform wait VMCalls"),
              ("src/r/platform.rs", "runtime: route Hull platform waits through VMCall"),
              ("src/hv/mod.rs", "runtime: suspend Blueprint waits on VM lanes"),
              ("crates/trueos-vm/src/vmcall.rs", "runtime: align platform wait VMCall opcodes"),
          ]
          for path, message in updates:
              update(path, message)
          PY
