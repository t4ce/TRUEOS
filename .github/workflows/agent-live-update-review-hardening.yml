      - name: Install pinned Rust formatter
        run: |
          set -euo pipefail
          channel="$(python3 - <<'PY'
          import tomllib
          with open('rust-toolchain.toml', 'rb') as handle:
              print(tomllib.load(handle)['toolchain']['channel'])
          PY
          )"
          rustup toolchain install "${channel}" --profile minimal --component rustfmt

      - name: Format and validate
        env:
          BASE_SHA: 74c4b5107545b98e1b400c08db162919bfb7c019
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo fmt --all -- --check
          git diff --check
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          vmx = Path('src/hv/vmx.rs').read_text()
          for name, next_name in [('vmxon', 'vmxoff'), ('vmxoff', 'vmclear')]:
              block = vmx.split(f'pub fn {name}', 1)[1].split(f'pub fn {next_name}', 1)[0]
              assert 'preserves_flags' not in block
              assert 'setna {fail}' in block

          percpu = Path('src/percpu.rs').read_text()
          live = Path('src/live_update.rs').read_text()
          pci = Path('src/pci/pci.rs').read_text()

          assert 'pub const CPU_SLOT_LIMIT: usize = 256;' in percpu
          assert 'const CPU_SLOT_LIMIT: usize = crate::percpu::CPU_SLOT_LIMIT;' in live
          assert 'crate::allcaps::hv::VM_CPU_SLOT_LIMIT' not in live
          assert 'static AP_TRANSITION_ENTERED: [AtomicBool; CPU_SLOT_LIMIT]' in live
          assert live.count('send_fixed_x2apic_ipi(cpu.slot, RENDEZVOUS_VECTOR)') == 2
          assert 'unsafe {\n                    core::arch::asm!("cli", "hlt", options(nomem, nostack));' in live
          assert 'WARM_HANDOFF_VALIDATION: AtomicU8' in live
          assert 'HANDOFF_VALIDATION_CHECKING => core::hint::spin_loop()' in live
          assert 'reconnect after boot for: hey that worked' not in live
          for step in range(1, 15):
              assert f'step={step:02}' in live, step
          assert 'if offset == 0x04' in pci
          assert 'if vendor == u16::MAX' in pci
          assert 'if command == u16::MAX' in pci
          assert 'if readback != u16::MAX' in pci

          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', os.environ['BASE_SHA']], text=True
          ).splitlines())
          expected = {
              '.github/workflows/agent-live-update-review-hardening.yml',
              'src/hv/vmx.rs',
              'src/live_update.rs',
              'src/pci/pci.rs',
              'src/percpu.rs',
          }
          assert changed == expected, (changed, expected)
          PY

      - name: Commit reviewed source changes and remove temporary workflow
