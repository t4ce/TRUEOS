          set -euo pipefail
          cat > /tmp/apply_review_fixes.py <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def read(path: str) -> str:
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path: str, text: str) -> None:
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact anchor, found {count}')
              return text.replace(old, new, 1)

          def replace_option_in_function(text: str, signature: str, label: str) -> str:
              start = text.find(signature)
              if start < 0:
                  raise SystemExit(f'{label}: function signature missing')
              end = text.find('\npub fn ', start + len(signature))
              if end < 0:
                  raise SystemExit(f'{label}: next function boundary missing')
              block = text[start:end]
              old = 'options(nostack, preserves_flags)'
              if block.count(old) != 1:
                  raise SystemExit(f'{label}: expected one preserves_flags option')
              block = block.replace(old, 'options(nostack)', 1)
              return text[:start] + block + text[end:]

          path = 'src/hv/vmx.rs'
          text = read(path)
          text = replace_option_in_function(text, 'pub fn vmxon(pa: u64) -> bool {', 'vmxon')
          text = replace_option_in_function(text, 'pub fn vmxoff() -> bool {', 'vmxoff')
          write(path, text)

          path = 'src/percpu.rs'
          text = read(path)
          text = replace_once(
              text,
