              'const MSR_IA32_GS_BASE: u32 = 0xC000_0101;\n\n'
              '/// Maximum host logical-CPU slots represented by fixed per-CPU tables.\n'
              'pub const CPU_SLOT_LIMIT: usize = 256;\n',
              'percpu host slot limit',
          )
          write(path, text)

          path = 'src/live_update.rs'
          text = read(path)
          text = replace_once(
              text,
              'sync::atomic::{AtomicBool, AtomicU64, Ordering},',
              'sync::atomic::{AtomicBool, AtomicU8, AtomicU64, Ordering},',
              'AtomicU8 import',
          )
          text = replace_once(
              text,
              'const CPU_SLOT_LIMIT: usize = crate::allcaps::hv::VM_CPU_SLOT_LIMIT;',
              'const CPU_SLOT_LIMIT: usize = crate::percpu::CPU_SLOT_LIMIT;',
              'live-update host slot limit',
          )
          text = replace_once(
              text,
              'const TRANSITION_COMMIT: u64 = 4;\n',
              'const TRANSITION_COMMIT: u64 = 4;\n\n'
