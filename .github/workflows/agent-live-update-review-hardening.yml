name: Live update review hardening

on:
  push:
    branches:
      - fix/live-update-review-hardening-20260821
  pull_request:
    branches:
      - true

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out review branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply and validate reviewed patch
        env:
          BASE_SHA: 74c4b5107545b98e1b400c08db162919bfb7c019
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          git apply --check tools/agent-live-update-review-fixes.patch
          git apply tools/agent-live-update-review-fixes.patch
          git diff --check
          python3 - <<'PY'
          from pathlib import Path

          vmx = Path('src/hv/vmx.rs').read_text()
          live = Path('src/live_update.rs').read_text()
          pci = Path('src/pci/pci.rs').read_text()
          percpu = Path('src/percpu.rs').read_text()
          update = Path('src/shell2/cmds/update.rs').read_text()

          for name, next_name in [('vmxon', 'vmxoff'), ('vmxoff', 'vmclear')]:
              block = vmx.split(f'pub fn {name}', 1)[1].split(f'pub fn {next_name}', 1)[0]
              assert 'setna {fail}' in block
              assert 'options(nostack, preserves_flags)' not in block
              assert 'options(nostack)' in block

          assert 'pub const CPU_SLOT_LIMIT: usize = 256;' in percpu
          assert 'const CPU_SLOT_LIMIT: usize = crate::percpu::CPU_SLOT_LIMIT;' in live
          assert 'static AP_TRANSITION_ENTERED: [AtomicBool; CPU_SLOT_LIMIT]' in live
          assert 'if cpu_count > CPU_SLOT_LIMIT' in live
          assert 'WARM_HANDOFF_VALIDATION: AtomicU8' in live
          assert 'HANDOFF_VALIDATION_CHECKING => core::hint::spin_loop()' in live
          assert 'unsafe {\n                    core::arch::asm!("cli", "hlt", options(nomem, nostack));' in live
          assert 'reconnect after boot for: hey that worked' not in live
          assert 'new kernel accepted this fresh TCP connection' in live
          for step in range(1, 21):
              assert f'step={step:02}' in live or f'step={step:02}a' in live, step

          assert 'if offset == 0x04' in pci
          assert 'if vendor == u16::MAX' in pci
          assert 'if command == u16::MAX' in pci
          assert 'if readback == u16::MAX' in pci

          assert 'const LIVE_ISO_URL: &str = "https://trueos.eu/TrueOS.7z";' in update
          assert 'transport=https-rustls' in update
          PY

      - name: Commit source changes
        env:
          BRANCH: fix/live-update-review-hardening-20260821
        run: |
          set -euo pipefail
          git config user.name "OpenAI review agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-live-update-review-hardening.yml
          git rm tools/agent-live-update-review-fixes.patch
          git add src/hv/vmx.rs src/live_update.rs src/pci/pci.rs src/percpu.rs src/shell2/cmds/update.rs
          git diff --cached --check
          git commit -m "Harden live-update transition review findings"
          git push origin "HEAD:${BRANCH}"
