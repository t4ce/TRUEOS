name: Live update review hardening

on:
  push:
    branches:
      - fix/live-update-review-hardening-20260821

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out review branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Verify exact review base
        env:
          BASE_SHA: 74c4b5107545b98e1b400c08db162919bfb7c019
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "${BASE_SHA}"

      - name: Apply verified minimal fixes
