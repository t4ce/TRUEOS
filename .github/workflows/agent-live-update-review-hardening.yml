name: Live update review hardening

on:
  push:
    branches:
      - fix/live-update-review-hardening-20260821
  pull_request:
    branches:
      - true

permissions:
  contents: write

concurrency:
  group: live-update-review-hardening-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact review inputs
        uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/agent-live-update-review-hardening.yml
            tools/agent-live-update-review-fixes.patch
            src/hv/vmx.rs
            src/live_update.rs
            src/pci/pci.rs
            src/percpu.rs
            src/shell2/cmds/update.rs

      - name: Apply and validate reviewed patch
        run: |
          set -euo pipefail
          test "$(git hash-object src/hv/vmx.rs)" = "8e1ac115363ef69d30bd7beaa1c93f6342cda8ce"
          test "$(git hash-object src/live_update.rs)" = "a18295e567d7d176c784c74a8a839621bac0afc3"
          test "$(git hash-object src/pci/pci.rs)" = "9eddedac7a969961ff41e0e465553d32730fa9b6"
          test "$(git hash-object src/percpu.rs)" = "7d10dec8406cf25c8098ae1585ca0b442e04d9b7"
          test "$(git hash-object src/shell2/cmds/update.rs)" = "948c6e0804acfe908f88f108014decf05df1316c"
          python3 - <<'PY'
          from pathlib import Path

          source = Path('tools/agent-live-update-review-fixes.patch')
          patch = source.read_text()

          old_static = '''@@ -154,7 +160,9 @@ impl WarmHandoff {
           #[unsafe(link_section = ".live_update_handoff")]
           static mut LIVE_HANDOFF: WarmHandoff = WarmHandoff::EMPTY;
           
          +static WARM_HANDOFF_VALIDATION: AtomicU8 = AtomicU8::new(HANDOFF_VALIDATION_UNCHECKED);
           static LIVE_UPDATE_IN_PROGRESS: AtomicBool = AtomicBool::new(false);
          +// Candidate AP release is independent from old-generation update admission.
           static WARM_APS_RELEASED: AtomicBool = AtomicBool::new(false);
           static SHELL_NOTICE_PENDING: AtomicBool = AtomicBool::new(false);
           static ACTIVE_CONTROL_HHDM: AtomicU64 = AtomicU64::new(0);
          '''
          new_static = '''@@ -154,6 +160,7 @@ impl WarmHandoff {
           #[unsafe(link_section = ".live_update_handoff")]
           static mut LIVE_HANDOFF: WarmHandoff = WarmHandoff::EMPTY;
           
          +static WARM_HANDOFF_VALIDATION: AtomicU8 = AtomicU8::new(HANDOFF_VALIDATION_UNCHECKED);
           static LIVE_UPDATE_IN_PROGRESS: AtomicBool = AtomicBool::new(false);
           static WARM_APS_RELEASED: AtomicBool = AtomicBool::new(false);
           static SHELL_NOTICE_PENDING: AtomicBool = AtomicBool::new(false);
          '''
          if patch.count(old_static) != 1:
              raise SystemExit('live-update static hunk no longer matches reviewed patch')
          patch = patch.replace(old_static, new_static, 1)

          old_percpu = '''diff --git a/src/percpu.rs b/src/percpu.rs
          index d396796..e0dcece 100644
          --- a/src/percpu.rs
          +++ b/src/percpu.rs
          @@ -2,4 +2,10 @@ use core::arch::asm;
           use core::sync::atomic::{AtomicBool, Ordering};
           
           const MSR_IA32_GS_BASE: u32 = 0xC000_0101;
          +
          +/// Host logical-CPU slot ceiling used by fixed per-CPU transition tables.
          +///
          +/// Keep this host-topology contract independent from VMX guest-slot policy.
          +pub const CPU_SLOT_LIMIT: usize = 256;
          +
           static TOTAL_SLOTS: core::sync::atomic::AtomicUsize = core::sync::atomic::AtomicUsize::new(0);
          '''
          new_percpu = '''diff --git a/src/percpu.rs b/src/percpu.rs
          index 7d10dec..e0dcece 100644
          --- a/src/percpu.rs
          +++ b/src/percpu.rs
          @@ -5,8 +5,14 @@ use alloc::boxed::Box;
           use alloc::vec::Vec;
           use embassy_executor::raw::Executor as RawExecutor;
           use x86_64::registers::model_specific::Msr;
           
           const MSR_IA32_GS_BASE: u32 = 0xC000_0101;
          +
          +/// Host logical-CPU slot ceiling used by fixed per-CPU transition tables.
          +///
          +/// Keep this host-topology contract independent from VMX guest-slot policy.
          +pub const CPU_SLOT_LIMIT: usize = 256;
          +
           static TOTAL_SLOTS: core::sync::atomic::AtomicUsize = core::sync::atomic::AtomicUsize::new(0);
           static CPU_SLOT_TABLE: core::sync::atomic::AtomicPtr<CpuSlot> =
               core::sync::atomic::AtomicPtr::new(core::ptr::null_mut());
          '''
          if patch.count(old_percpu) != 1:
              raise SystemExit('percpu hunk no longer matches reviewed patch')
          patch = patch.replace(old_percpu, new_percpu, 1)
          Path('/tmp/live-update-review-fixes.patch').write_text(patch)
          PY
          git apply --check /tmp/live-update-review-fixes.patch
          git apply /tmp/live-update-review-fixes.patch
          git diff --check
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          vmx = Path('src/hv/vmx.rs').read_text()
          live = Path('src/live_update.rs').read_text()
          pci = Path('src/pci/pci.rs').read_text()
          percpu = Path('src/percpu.rs').read_text()
          update = Path('src/shell2/cmds/update.rs').read_text()

          for name, next_name in [('vmxon', 'vmxoff'), ('vmxoff', 'vmclear')]:
              block = vmx.split(f'pub fn {name}', 1)[1].split(f'pub fn {next_name}', 1)[0]
              assert 'setna {fail}' in block
              assert 'options(nostack, preserves_flags)' not in block
              assert 'options(nostack)' in block

          assert 'pub const CPU_SLOT_LIMIT: usize = 256;' in percpu
          assert 'const CPU_SLOT_LIMIT: usize = crate::percpu::CPU_SLOT_LIMIT;' in live
          assert 'static AP_TRANSITION_ENTERED: [AtomicBool; CPU_SLOT_LIMIT]' in live
          assert 'if cpu_count > CPU_SLOT_LIMIT' in live
          assert 'WARM_HANDOFF_VALIDATION: AtomicU8' in live
          assert 'HANDOFF_VALIDATION_CHECKING => core::hint::spin_loop()' in live

          abort = live.split('fn abort_rendezvous', 1)[1].split('unsafe fn install_transition_mapping', 1)[0]
          assert 'unsafe {' in abort
          assert 'core::arch::asm!("cli", "hlt", options(nomem, nostack));' in abort

          assert 'reconnect after boot for: hey that worked' not in live
          assert 'new kernel accepted this fresh TCP connection' in live
          markers = update + '\n' + live
          for step in range(1, 21):
              assert f'step={step:02}' in markers, step

          assert 'if offset == 0x04' in pci
          assert 'if vendor == u16::MAX' in pci
          assert 'if command == u16::MAX' in pci
          assert 'if readback == u16::MAX' in pci

          assert 'const LIVE_ISO_URL: &str = "https://trueos.eu/TrueOS.7z";' in update
          assert 'transport=https-rustls' in update

          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {
              'src/hv/vmx.rs',
              'src/live_update.rs',
              'src/pci/pci.rs',
              'src/percpu.rs',
              'src/shell2/cmds/update.rs',
          }
          assert changed == expected, (changed, expected)
          PY

      - name: Commit source changes
        env:
          BRANCH: fix/live-update-review-hardening-20260821
        run: |
          set -euo pipefail
          git config user.name "OpenAI review agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-live-update-review-hardening.yml
          git rm tools/agent-live-update-review-fixes.patch
          git add src/hv/vmx.rs src/live_update.rs src/pci/pci.rs src/percpu.rs src/shell2/cmds/update.rs
          git diff --cached --check
          git commit -m "Harden live-update transition review findings"
          git push origin "HEAD:${BRANCH}"
