              'const SHELL_NOTICE: &[u8] = b"\\r\\nupdate live: hey that worked, new kernel here :)\\r\\n";',
              'const SHELL_NOTICE: &[u8] = b"\\r\\nupdate live: replacement kernel booted; fresh TCP shell active; VM restore is running\\r\\n";',
              'post-boot shell notice',
