name: Font warm diagnostic preparation
on:
  push:
    branches: ['diag/font-warm-dispatch']
    paths:
      - 'tools/_prepare_font_warm_diag.py'
      - 'tools/test_font_warm_diag.py'
      - '.github/workflows/font-warm-diag.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: TRUEOS
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /AGENTS.md
            /src/log_os.rs
            /src/intel/gpu_font.rs
            /src/intel/gpgpu/operations/primitives.rs
            /src/intel/gpgpu/operations/submission_2d.rs
            /src/intel/gpgpu/rcs/commands.rs
            /src/shell2/shell2_cmd_registry.rs
            /tools/trueos-doc
            /tools/test_tgl_gpu_log_profile.py
            /tools/test_font_warm_diag.py
            /tools/_prepare_font_warm_diag.py
      - name: Read pinned shared log-os without unrelated app checkout
        run: |
          set -euo pipefail
          mkdir -p TRUEOS-Blueprints
          git init "$RUNNER_TEMP/font-diag-log-os"
          git -C "$RUNNER_TEMP/font-diag-log-os" remote add origin https://github.com/t4ce/TRUEOS-Blueprints.git
          git -C "$RUNNER_TEMP/font-diag-log-os" -c protocol.version=2 fetch --filter=blob:none --depth=1 origin d4bedf7b3cbaa96c8bca51181e0e3a5509ad619c
          git -C "$RUNNER_TEMP/font-diag-log-os" archive FETCH_HEAD crates/log-os | tar -x -C TRUEOS-Blueprints
      - name: Query policy, apply scoped edits and test
        working-directory: TRUEOS
        run: |
          set -euo pipefail
          python3 tools/trueos-doc topic logs
          python3 tools/_prepare_font_warm_diag.py
          python3 tools/test_tgl_gpu_log_profile.py
          python3 tools/test_font_warm_diag.py
          for f in src/log_os.rs src/intel/gpu_font.rs src/intel/gpgpu/operations/primitives.rs src/intel/gpgpu/operations/submission_2d.rs src/intel/gpgpu/rcs/commands.rs; do
            rustfmt --edition 2024 --config skip_children=true --emit stdout "$f" >/dev/null
          done
          git diff --check
          git diff --stat
          git diff -- src/log_os.rs src/intel/gpu_font.rs src/intel/gpgpu/operations/primitives.rs src/intel/gpgpu/operations/submission_2d.rs src/intel/gpgpu/rcs/commands.rs
      - name: Store validated immutable blobs only
        working-directory: TRUEOS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          result = {}
          paths = ['src/log_os.rs', 'src/intel/gpu_font.rs', 'src/intel/gpgpu/operations/primitives.rs', 'src/intel/gpgpu/operations/submission_2d.rs', 'src/intel/gpgpu/rcs/commands.rs']
          for path in paths:
              data = Path(path).read_bytes()
              expected = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
              request = urllib.request.Request('https://api.github.com/repos/t4ce/TRUEOS/git/blobs',
                  data=json.dumps({'content': data.decode(), 'encoding': 'utf-8'}).encode(), method='POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              with urllib.request.urlopen(request) as response:
                  blob = json.load(response)
              assert blob['sha'] == expected
              result[path] = expected
          print('TESTED_BLOBS=' + json.dumps(result, sort_keys=True))
          PY
