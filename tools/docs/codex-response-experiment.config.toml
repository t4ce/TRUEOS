# Tested QEMU workaround for the native TRUEOS Codex integration.
# Merge these keys into apps/codex/.codex/config.toml for a new launch.
# Keep the existing model, permissions, projects, and authentication settings.
# Save the original config; restore its plugin/provider values to undo this experiment.
model_provider = "trueos_http_probe"

[features]
plugins = false

# A separate provider is necessary: this Codex version does not merge overrides
# into the built-in OpenAI provider. The name and auth setting retain OpenAI routing.
[model_providers.trueos_http_probe]
name = "OpenAI"
wire_api = "responses"
requires_openai_auth = true
supports_websockets = false
