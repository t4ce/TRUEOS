<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-label="Memory ownership and the four meanings of synchronization"><defs><marker id="cpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2363ad"/></marker><marker id="compiler" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7551ae"/></marker><marker id="gpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16764d"/></marker><marker id="memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007e88"/></marker><marker id="proposal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b47710"/></marker><marker id="error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb3e40"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/></marker></defs><rect width="1600" height="1040" fill="#fff"/><text x="40" y="39" font-family="Arial,sans-serif" font-size="14" fill="#65758b" font-weight="700">TRUEOS × ODIN-SON  /  EXECUTION ATLAS</text><text x="40" y="83" font-family="Arial,sans-serif" font-size="33" fill="#16283f" font-weight="700">Memory ownership and the four meanings of synchronization</text><text x="40" y="117" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">An integrated GPU can access system RAM; address translation, visibility and ownership still need explicit contracts.</text><rect x="40" y="160" width="465" height="150" rx="12" fill="#ebf8f8" stroke="#007e88" stroke-width="2"/><text x="58" y="191" font-family="Arial,sans-serif" font-size="20" fill="#007e88" font-weight="700">CPU address / app-owned allocation</text><text x="58" y="221" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">CPU virtual address → physical backing pages.</text><text x="58" y="246" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">An Odin pointer is not a valid GPU virtual</text><text x="58" y="271" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">address by itself.</text><rect x="570" y="160" width="470" height="150" rx="12" fill="#ebf8f8" stroke="#007e88" stroke-width="2"/><text x="588" y="191" font-family="Arial,sans-serif" font-size="20" fill="#007e88" font-weight="700">GPUVM / driver-managed mapping</text><text x="588" y="221" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">GPU virtual address → mapped backing. Generic</text><text x="588" y="246" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">vVideoMem can pin guest pages; current pixel</text><text x="588" y="271" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">output uses an owned UI4 surface.</text><rect x="1105" y="160" width="455" height="150" rx="12" fill="#ebf8f8" stroke="#007e88" stroke-width="2"/><text x="1123" y="191" font-family="Arial,sans-serif" font-size="20" fill="#007e88" font-weight="700">GPU control + result storage</text><text x="1123" y="221" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Runtime owns batch, descriptors, context and</text><text x="1123" y="246" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">marker storage. Stage admitted code; retain</text><text x="1123" y="271" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">backing through retirement.</text><polyline points="505,235 570,235" fill="none" stroke="#007e88" stroke-width="2.5" marker-end="url(#memory)"/><text x="505" y="216" font-family="Arial,sans-serif" font-size="15" fill="#007e88" font-weight="600">resolve / map</text><polyline points="1040,235 1105,235" fill="none" stroke="#007e88" stroke-width="2.5" marker-end="url(#memory)"/><rect x="40" y="372" width="320" height="128" rx="12" fill="#ebf8f8" stroke="#007e88" stroke-width="2"/><text x="58" y="403" font-family="Arial,sans-serif" font-size="20" fill="#007e88" font-weight="700">Writable by producer</text><text x="58" y="433" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Prepare source / frame; release</text><text x="58" y="458" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">prior CPU writes before submit.</text><rect x="440" y="372" width="320" height="128" rx="12" fill="#edf8f0" stroke="#16764d" stroke-width="2"/><text x="458" y="403" font-family="Arial,sans-serif" font-size="20" fill="#16764d" font-weight="700">GPU owns work</text><text x="458" y="433" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Read/write reservations and</text><text x="458" y="458" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">frame lease remain held.</text><rect x="840" y="372" width="320" height="128" rx="12" fill="#edf8f0" stroke="#16764d" stroke-width="2"/><text x="858" y="403" font-family="Arial,sans-serif" font-size="20" fill="#16764d" font-weight="700">Retirement proven</text><text x="858" y="433" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Ordered completion + saved</text><text x="858" y="458" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">context; release to consumer.</text><rect x="1240" y="372" width="320" height="128" rx="12" fill="#ebf8f8" stroke="#007e88" stroke-width="2"/><text x="1258" y="403" font-family="Arial,sans-serif" font-size="20" fill="#007e88" font-weight="700">Consumer acquires</text><text x="1258" y="433" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Visibility + ownership permit</text><text x="1258" y="458" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">CPU read or UI4 publish.</text><polyline points="360,435 440,435" fill="none" stroke="#16764d" stroke-width="2.5" marker-end="url(#gpu)"/><polyline points="760,435 840,435" fill="none" stroke="#16764d" stroke-width="2.5" marker-end="url(#gpu)"/><polyline points="1160,435 1240,435" fill="none" stroke="#16764d" stroke-width="2.5" marker-end="url(#gpu)"/><rect x="440" y="551" width="720" height="92" rx="12" fill="#fff0ef" stroke="#bb3e40" stroke-width="2"/><text x="458" y="582" font-family="Arial,sans-serif" font-size="20" fill="#bb3e40" font-weight="700">Ambiguous completion / timeout</text><text x="458" y="612" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Retain carrier and surface backing. Dropping a waiter does not cancel</text><text x="458" y="637" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">hardware.</text><polyline points="600,500 600,551" fill="none" stroke="#bb3e40" stroke-width="2.5" marker-end="url(#error)"/><path d="M40 678 H1560" stroke="#dce4ec"/><text x="48" y="718" font-family="Arial,sans-serif" font-size="19" fill="#16764d" font-weight="700">1 · Instruction dependency</text><text x="420" y="718" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Register / ALU / SEND readiness inside an EU thread; conservative @1 in generated math.</text><text x="48" y="773" font-family="Arial,sans-serif" font-size="19" fill="#16764d" font-weight="700">2 · Device memory visibility</text><text x="420" y="773" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Data-cache / memory fence orders writes; EU EOT terminates a thread.</text><text x="48" y="828" font-family="Arial,sans-serif" font-size="19" fill="#16764d" font-weight="700">3 · Queue and context retirement</text><text x="420" y="828" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Ordered marker plus context proof permits host resource reuse and completion accounting.</text><text x="48" y="883" font-family="Arial,sans-serif" font-size="19" fill="#16764d" font-weight="700">4 · Application dependency</text><text x="420" y="883" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">A consumer waits for its exact producer; a frame publishes only after its release token exists.</text><text x="40" y="933" font-family="Arial,sans-serif" font-size="16" fill="#65758b" font-weight="400">Workgroup barriers are another contract; the bounded straight-line math body does not implement general workgroup synchronization.</text><path d="M40 951 H1560" stroke="#dce4ec"/><rect x="42" y="970" width="15" height="15" rx="3" fill="#2363ad"/><text x="65" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">CPU / host</text><rect x="220" y="970" width="15" height="15" rx="3" fill="#7551ae"/><text x="243" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Compiler</text><rect x="391" y="970" width="15" height="15" rx="3" fill="#16764d"/><text x="414" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">GPU / driver</text><rect x="590" y="970" width="15" height="15" rx="3" fill="#007e88"/><text x="613" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Memory / data</text><rect x="800" y="970" width="15" height="15" rx="3" fill="#b47710"/><text x="823" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Dashed: proposed or gap</text><rect x="1135" y="970" width="15" height="15" rx="3" fill="#bb3e40"/><text x="1158" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Failure / quarantine</text><text x="40" y="1018" font-family="Arial,sans-serif" font-size="13" fill="#30445b" font-weight="400">05 / 06    •    S5–S9, S12 • Shared backing reduces transfer needs; it does not merge ownership or address spaces.</text><text x="1130" y="1018" font-family="Arial,sans-serif" font-size="13" fill="#30445b" font-weight="400">Code review: 24 Oct 2026 • no new rig run</text></svg>