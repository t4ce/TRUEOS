<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-label="One application; two execution engines"><defs><marker id="cpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2363ad"/></marker><marker id="compiler" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7551ae"/></marker><marker id="gpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16764d"/></marker><marker id="memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007e88"/></marker><marker id="proposal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b47710"/></marker><marker id="error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb3e40"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/></marker></defs><rect width="1600" height="1040" fill="#fff"/><text x="40" y="39" font-family="Arial,sans-serif" font-size="14" fill="#65758b" font-weight="700">TRUEOS × ODIN-SON  /  EXECUTION ATLAS</text><text x="40" y="83" font-family="Arial,sans-serif" font-size="33" fill="#16283f" font-weight="700">One application; two execution engines</text><text x="40" y="117" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Current structure, with separate compiler, CPU carrier, GPU submission and completion responsibilities.</text><rect x="40" y="155" width="400" height="125" rx="12" fill="#f4effb" stroke="#7551ae" stroke-width="2"/><text x="58" y="186" font-family="Arial,sans-serif" font-size="20" fill="#7551ae" font-weight="700">Odin application / compiler Blueprint</text><text x="58" y="216" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Source, application state, input, frame</text><text x="58" y="241" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">orchestration. Compiler itself runs on</text><text x="58" y="266" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">CPU.</text><rect x="560" y="155" width="445" height="125" rx="12" fill="#f4effb" stroke="#7551ae" stroke-width="2"/><text x="578" y="186" font-family="Arial,sans-serif" font-size="20" fill="#7551ae" font-weight="700">Odin CPU target</text><text x="578" y="216" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Odin AST → ordinary typecheck / BAC → x64</text><text x="578" y="241" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">object → Blueprint package.</text><rect x="1120" y="155" width="440" height="125" rx="12" fill="#f4effb" stroke="#7551ae" stroke-width="2"/><text x="1138" y="186" font-family="Arial,sans-serif" font-size="20" fill="#7551ae" font-weight="700">Odin Xe-LP target</text><text x="1138" y="216" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Tagged bounded math → typed GPU ops → BAC /</text><text x="1138" y="241" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">allocation → SIMD8 EU bytes.</text><polyline points="440,215 560,215" fill="none" stroke="#7551ae" stroke-width="2.5" marker-end="url(#compiler)"/><polyline points="440,185 500,185 500,140 1340,140 1340,155" fill="none" stroke="#7551ae" stroke-width="2.5" marker-end="url(#compiler)"/><text x="830" y="135" font-family="Arial,sans-serif" font-size="15" fill="#7551ae" font-weight="600">GPU target choice</text><rect x="40" y="337" width="400" height="160" rx="12" fill="#eef5ff" stroke="#2363ad" stroke-width="2"/><text x="58" y="368" font-family="Arial,sans-serif" font-size="20" fill="#2363ad" font-weight="700">Guest execution state</text><text x="58" y="398" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">VM identity + run generation; guest</text><text x="58" y="423" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">registers; EPT; lifecycle. Conceptual</text><text x="58" y="448" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">vCPU state is distributed. [S1–S4]</text><rect x="560" y="337" width="445" height="160" rx="12" fill="#eef5ff" stroke="#2363ad" stroke-width="2"/><text x="578" y="368" font-family="Arial,sans-serif" font-size="20" fill="#2363ad" font-weight="700">Executor carrier / CPU lane</text><text x="578" y="398" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">AP2+ lease → vm_task → VMCS → VMLAUNCH /</text><text x="578" y="423" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">VMRESUME. Guest code executes CPU</text><text x="578" y="448" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">instructions.</text><polyline points="240,280 240,337" fill="none" stroke="#2363ad" stroke-width="2.5" marker-end="url(#cpu)"/><polyline points="440,410 560,410" fill="none" stroke="#2363ad" stroke-width="2.5" marker-end="url(#cpu)"/><text x="448" y="392" font-family="Arial,sans-serif" font-size="15" fill="#2363ad" font-weight="600">placement / lease</text><polyline points="785,280 785,337" fill="none" stroke="#2363ad" stroke-width="2.5" marker-end="url(#cpu)"/><rect x="1120" y="337" width="440" height="160" rx="12" fill="#edf8f0" stroke="#16764d" stroke-width="2"/><text x="1138" y="368" font-family="Arial,sans-serif" font-size="20" fill="#16764d" font-weight="700">Generated pixel bridge (current)</text><text x="1138" y="398" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">UI4 upload + render ABI; validate immutable</text><text x="1138" y="423" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">body; hold owned destination surface.</text><text x="1138" y="448" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">[S7–S9]</text><polyline points="1340,280 1340,337" fill="none" stroke="#7551ae" stroke-width="2.5" marker-end="url(#compiler)"/><text x="1353" y="310" font-family="Arial,sans-serif" font-size="15" fill="#7551ae" font-weight="600">body upload</text><polyline points="1005,420 1120,420" fill="none" stroke="#65758b" stroke-width="2.5" marker-end="url(#gray)"/><text x="1018" y="399" font-family="Arial,sans-serif" font-size="15" fill="#65758b" font-weight="600">guest ABI</text><rect x="560" y="568" width="445" height="160" rx="12" fill="#edf8f0" stroke="#16764d" stroke-width="2"/><text x="578" y="599" font-family="Arial,sans-serif" font-size="20" fill="#16764d" font-weight="700">TRUEOS GPU driver + GuC</text><text x="578" y="629" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">System RCS context; row-batch encoding;</text><text x="578" y="654" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">descriptors, GPUVM mapping, submit,</text><text x="578" y="679" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">completion polling.</text><rect x="1120" y="568" width="440" height="160" rx="12" fill="#edf8f0" stroke="#16764d" stroke-width="2"/><text x="1138" y="599" font-family="Arial,sans-serif" font-size="20" fill="#16764d" font-weight="700">Intel GPU hardware</text><text x="1138" y="629" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Command stream → dispatch → EU SIMD8 math →</text><text x="1138" y="654" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">bounded store → fence → EOT.</text><polyline points="1340,497 1340,533 785,533 785,568" fill="none" stroke="#65758b" stroke-width="2.5" marker-end="url(#gray)"/><text x="814" y="524" font-family="Arial,sans-serif" font-size="15" fill="#65758b" font-weight="600">driver request</text><polyline points="1005,646 1120,646" fill="none" stroke="#65758b" stroke-width="2.5" marker-end="url(#gray)"/><text x="1025" y="628" font-family="Arial,sans-serif" font-size="15" fill="#65758b" font-weight="600">submit</text><polyline points="1340,728 1340,768 785,768 785,728" fill="none" stroke="#16764d" stroke-width="2.5" marker-end="url(#gpu)"/><text x="850" y="790" font-family="Arial,sans-serif" font-size="15" fill="#16764d" font-weight="600">ordered marker + saved-context retirement</text><rect x="40" y="568" width="400" height="160" rx="12" fill="#ebf8f8" stroke="#007e88" stroke-width="2"/><text x="58" y="599" font-family="Arial,sans-serif" font-size="20" fill="#007e88" font-weight="700">Mediated vGPU broker</text><text x="58" y="629" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Principal, devices, buffers, queues,</text><text x="58" y="654" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">timelines. A distinct reusable boundary;</text><text x="58" y="679" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">pixel bridge uses its existing UI4</text><text x="58" y="704" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">lease. [S5, S6]</text><rect x="40" y="821" width="1520" height="98" rx="12" fill="#fff6e3" stroke="#b47710" stroke-width="2" stroke-dasharray="9 5"/><text x="58" y="852" font-family="Arial,sans-serif" font-size="20" fill="#b47710" font-weight="700">Coordination can be shared; execution contracts stay explicit</text><text x="58" y="882" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">CPU carriers run tasks / guest contexts. GPU EUs execute admitted kernels. A common work graph can connect them; today there is no single demonstrated CPU/GPU</text><text x="58" y="907" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">submission API.</text><polyline points="785,728 785,751 503,751 503,458 440,458" fill="none" stroke="#16764d" stroke-width="2.5" marker-end="url(#gpu)"/><text x="460" y="779" font-family="Arial,sans-serif" font-size="15" fill="#16764d" font-weight="600">release / return</text><path d="M40 951 H1560" stroke="#dce4ec"/><rect x="42" y="970" width="15" height="15" rx="3" fill="#2363ad"/><text x="65" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">CPU / host</text><rect x="220" y="970" width="15" height="15" rx="3" fill="#7551ae"/><text x="243" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Compiler</text><rect x="391" y="970" width="15" height="15" rx="3" fill="#16764d"/><text x="414" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">GPU / driver</text><rect x="590" y="970" width="15" height="15" rx="3" fill="#007e88"/><text x="613" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Memory / data</text><rect x="800" y="970" width="15" height="15" rx="3" fill="#b47710"/><text x="823" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Dashed: proposed or gap</text><rect x="1135" y="970" width="15" height="15" rx="3" fill="#bb3e40"/><text x="1158" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Failure / quarantine</text><text x="40" y="1018" font-family="Arial,sans-serif" font-size="13" fill="#30445b" font-weight="400">01 / 06    •    S1–S9, S12 • Lines: gray control; purple compilation; green completion; teal data (later sheets).</text><text x="1130" y="1018" font-family="Arial,sans-serif" font-size="13" fill="#30445b" font-weight="400">Code review: 24 Oct 2026 • no new rig run</text></svg>