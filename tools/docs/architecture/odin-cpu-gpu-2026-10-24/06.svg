<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-label="A possible common work model over CPU and GPU backends"><defs><marker id="cpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2363ad"/></marker><marker id="compiler" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7551ae"/></marker><marker id="gpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16764d"/></marker><marker id="memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007e88"/></marker><marker id="proposal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b47710"/></marker><marker id="error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb3e40"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/></marker></defs><rect width="1600" height="1040" fill="#fff"/><text x="40" y="39" font-family="Arial,sans-serif" font-size="14" fill="#65758b" font-weight="700">TRUEOS × ODIN-SON  /  EXECUTION ATLAS</text><text x="40" y="83" font-family="Arial,sans-serif" font-size="33" fill="#16283f" font-weight="700">A possible common work model over CPU and GPU backends</text><text x="40" y="117" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">DESIGN PROPOSAL • A shared dependency / ownership protocol can coexist with distinct execution engines.</text><rect x="40" y="160" width="450" height="175" rx="12" fill="#fff6e3" stroke="#b47710" stroke-width="2" stroke-dasharray="9 5"/><text x="58" y="191" font-family="Arial,sans-serif" font-size="20" fill="#b47710" font-weight="700">Common Work descriptor</text><text x="58" y="221" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Owner + generation; task/kernel identity;</text><text x="58" y="246" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">typed buffer views; read/write effects;</text><text x="58" y="271" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">dependencies; completion + error identity.</text><rect x="575" y="160" width="450" height="175" rx="12" fill="#fff6e3" stroke="#b47710" stroke-width="2" stroke-dasharray="9 5"/><text x="593" y="191" font-family="Arial,sans-serif" font-size="20" fill="#b47710" font-weight="700">Admission / ready graph</text><text x="593" y="221" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Validate target capabilities, dependencies and</text><text x="593" y="246" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">reservations. Choose an explicit target;</text><text x="593" y="271" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">publish ready work in batches.</text><rect x="1110" y="160" width="450" height="175" rx="12" fill="#fff6e3" stroke="#b47710" stroke-width="2" stroke-dasharray="9 5"/><text x="1128" y="191" font-family="Arial,sans-serif" font-size="20" fill="#b47710" font-weight="700">Exact completion record</text><text x="1128" y="221" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Success / failure belongs to this work item.</text><text x="1128" y="246" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Wake consumers; release ownership only after</text><text x="1128" y="271" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">backend retirement.</text><polyline points="490,245 575,245" fill="none" stroke="#b47710" stroke-width="2.5" marker-end="url(#proposal)" stroke-dasharray="8 6"/><rect x="40" y="414" width="450" height="180" rx="12" fill="#eef5ff" stroke="#2363ad" stroke-width="2"/><text x="58" y="445" font-family="Arial,sans-serif" font-size="20" fill="#2363ad" font-weight="700">CPU execution adapter</text><text x="58" y="475" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Guest context or host task → carrier lease →</text><text x="58" y="500" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">executor / VMX. Preserve guest identity,</text><text x="58" y="525" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">memory isolation, yield and lane-affinity</text><text x="58" y="550" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">rules.</text><rect x="575" y="414" width="450" height="180" rx="12" fill="#edf8f0" stroke="#16764d" stroke-width="2"/><text x="593" y="445" font-family="Arial,sans-serif" font-size="20" fill="#16764d" font-weight="700">GPU execution adapter</text><text x="593" y="475" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Kernel ABI + grid → GPUVM views → admitted</text><text x="593" y="500" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">command batches → GuC / EUs. Preserve</text><text x="593" y="525" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">visibility, exact retirement and error</text><text x="593" y="550" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">quarantine.</text><rect x="1110" y="414" width="450" height="180" rx="12" fill="#eef5ff" stroke="#2363ad" stroke-width="2"/><text x="1128" y="445" font-family="Arial,sans-serif" font-size="20" fill="#2363ad" font-weight="700">Independent CPU work / consumers</text><text x="1128" y="475" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Ready work runs while GPU is outstanding.</text><text x="1128" y="500" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Dependent CPU reads / display publication wait</text><text x="1128" y="525" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">on the matching completion.</text><polyline points="725,335 725,373 265,373 265,414" fill="none" stroke="#b47710" stroke-width="2.5" marker-end="url(#proposal)" stroke-dasharray="8 6"/><polyline points="800,335 800,414" fill="none" stroke="#b47710" stroke-width="2.5" marker-end="url(#proposal)" stroke-dasharray="8 6"/><polyline points="265,594 265,636 1067,636 1067,245 1110,245" fill="none" stroke="#b47710" stroke-width="2.5" marker-end="url(#proposal)" stroke-dasharray="8 6"/><text x="630" y="661" font-family="Arial,sans-serif" font-size="15" fill="#b47710" font-weight="600">common completion protocol</text><polyline points="800,594 800,636" fill="none" stroke="#b47710" stroke-width="2.5" marker-end="url(#proposal)" stroke-dasharray="8 6"/><polyline points="1335,335 1335,414" fill="none" stroke="#b47710" stroke-width="2.5" marker-end="url(#proposal)" stroke-dasharray="8 6"/><text x="1350" y="381" font-family="Arial,sans-serif" font-size="15" fill="#b47710" font-weight="600">wake dependent work</text><path d="M40 700 H1560" stroke="#dce4ec"/><text x="40" y="741" font-family="Arial,sans-serif" font-size="24" fill="#16283f" font-weight="700">What to optimize and measure</text><text x="40" y="780" font-family="Arial,sans-serif" font-size="18" fill="#30445b" font-weight="400">Cold work = compile + admit / prepare + map / visibility + submit + GPU execution + retire / acquire.</text><text x="40" y="811" font-family="Arial,sans-serif" font-size="18" fill="#30445b" font-weight="400">Warm work can reuse admitted code. Batch independent elements to amortize submission; split only for real dependencies / limits.</text><text x="40" y="842" font-family="Arial,sans-serif" font-size="18" fill="#30445b" font-weight="400">Compare against scalar and vectorized CPU execution on identical data, including end-to-end latency and useful CPU overlap.</text><text x="40" y="873" font-family="Arial,sans-serif" font-size="18" fill="#30445b" font-weight="400">SIMD width, independent hardware threads, workgroup count and instruction-level parallelism are separate tuning dimensions.</text><text x="40" y="904" font-family="Arial,sans-serif" font-size="18" fill="#30445b" font-weight="400">A device-resident worklist needs its own validated protocol and memory operations; the current math-body subset does not provide it.</text><path d="M40 951 H1560" stroke="#dce4ec"/><rect x="42" y="970" width="15" height="15" rx="3" fill="#2363ad"/><text x="65" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">CPU / host</text><rect x="220" y="970" width="15" height="15" rx="3" fill="#7551ae"/><text x="243" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Compiler</text><rect x="391" y="970" width="15" height="15" rx="3" fill="#16764d"/><text x="414" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">GPU / driver</text><rect x="590" y="970" width="15" height="15" rx="3" fill="#007e88"/><text x="613" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Memory / data</text><rect x="800" y="970" width="15" height="15" rx="3" fill="#b47710"/><text x="823" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Dashed: proposed or gap</text><rect x="1135" y="970" width="15" height="15" rx="3" fill="#bb3e40"/><text x="1158" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Failure / quarantine</text><text x="40" y="1018" font-family="Arial,sans-serif" font-size="13" fill="#30445b" font-weight="400">06 / 06    •    Proposal based on S1–S13 • No new runtime, scheduler, offload policy or hardware capability is claimed implemented.</text><text x="1130" y="1018" font-family="Arial,sans-serif" font-size="13" fill="#30445b" font-weight="400">Code review: 24 Oct 2026 • no new rig run</text></svg>