<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-label="Where the vCPU abstraction lives today"><defs><marker id="cpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2363ad"/></marker><marker id="compiler" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7551ae"/></marker><marker id="gpu" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16764d"/></marker><marker id="memory" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#007e88"/></marker><marker id="proposal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b47710"/></marker><marker id="error" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#bb3e40"/></marker><marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#65758b"/></marker></defs><rect width="1600" height="1040" fill="#fff"/><text x="40" y="39" font-family="Arial,sans-serif" font-size="14" fill="#65758b" font-weight="700">TRUEOS × ODIN-SON  /  EXECUTION ATLAS</text><text x="40" y="83" font-family="Arial,sans-serif" font-size="33" fill="#16283f" font-weight="700">Where the vCPU abstraction lives today</text><text x="40" y="117" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">A guest execution context, an executor lane, a CPU SIMD element and a GPU SIMD element have different identities.</text><rect x="40" y="160" width="465" height="190" rx="12" fill="#eef5ff" stroke="#2363ad" stroke-width="2"/><text x="58" y="191" font-family="Arial,sans-serif" font-size="20" fill="#2363ad" font-weight="700">Logical guest / vCPU-like state</text><text x="58" y="221" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">VM ID + run generation; guest GPRs and extended</text><text x="58" y="246" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">state; guest RIP/control state in VMCS; EPT-</text><text x="58" y="271" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">backed address space and lifecycle. [S2–S4]</text><rect x="570" y="160" width="470" height="190" rx="12" fill="#eef5ff" stroke="#2363ad" stroke-width="2"/><text x="588" y="191" font-family="Arial,sans-serif" font-size="20" fill="#2363ad" font-weight="700">Carrier lease + placement</text><text x="588" y="221" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">LaneRole::VmHull, slot, core kind,</text><text x="588" y="246" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">WorkerSpawner, LaneLease. Reserved AP2+</text><text x="588" y="271" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">placement. A lane also supports other roles.</text><text x="588" y="296" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">[S1, S2]</text><rect x="1105" y="160" width="455" height="190" rx="12" fill="#eef5ff" stroke="#2363ad" stroke-width="2"/><text x="1123" y="191" font-family="Arial,sans-serif" font-size="20" fill="#2363ad" font-weight="700">Physical execution substrate</text><text x="1123" y="221" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Per-slot VMXON / VMCS backing; lane-local VPID</text><text x="1123" y="246" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">assignment; current CPU executor polls</text><text x="1123" y="271" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">vm_task. [S3, S4, S12]</text><polyline points="505,255 570,255" fill="none" stroke="#65758b" stroke-width="2.5" marker-end="url(#gray)"/><polyline points="1040,255 1105,255" fill="none" stroke="#65758b" stroke-width="2.5" marker-end="url(#gray)"/><rect x="40" y="400" width="465" height="155" rx="12" fill="#eef5ff" stroke="#2363ad" stroke-width="2"/><text x="58" y="431" font-family="Arial,sans-serif" font-size="20" fill="#2363ad" font-weight="700">Run / suspend / resume</text><text x="58" y="461" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Guest instructions → VM exit → host handler.</text><text x="58" y="486" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Cooperative yield / wait boundaries return to</text><text x="58" y="511" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">executor; eligible resume re-enters VM.</text><rect x="570" y="400" width="470" height="155" rx="12" fill="#eef5ff" stroke="#2363ad" stroke-width="2"/><text x="588" y="431" font-family="Arial,sans-serif" font-size="20" fill="#2363ad" font-weight="700">Affinity invariant</text><text x="588" y="461" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Current run validates its lane tuple before</text><text x="588" y="486" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">entry. Async migration cannot silently use</text><text x="588" y="511" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">another lane’s VMCS. [S3, S4]</text><rect x="1105" y="400" width="455" height="155" rx="12" fill="#eef5ff" stroke="#2363ad" stroke-width="2"/><text x="1123" y="431" font-family="Arial,sans-serif" font-size="20" fill="#2363ad" font-weight="700">Retire / retain / quarantine</text><text x="1123" y="461" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Pause can retain carrier + VMCS. Teardown</text><text x="1123" y="486" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">invalidates VPID before lease reuse; failed</text><text x="1123" y="511" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">invalidation quarantines lane.</text><polyline points="270,350 270,400" fill="none" stroke="#2363ad" stroke-width="2.5" marker-end="url(#cpu)"/><polyline points="805,350 805,400" fill="none" stroke="#2363ad" stroke-width="2.5" marker-end="url(#cpu)"/><polyline points="1330,350 1330,400" fill="none" stroke="#2363ad" stroke-width="2.5" marker-end="url(#cpu)"/><path d="M40 600 H1560" stroke="#dce4ec"/><text x="40" y="637" font-family="Arial,sans-serif" font-size="23" fill="#16283f" font-weight="700">Terms to keep separate in design discussions</text><text x="50" y="677" font-family="Arial,sans-serif" font-size="18" fill="#2363ad" font-weight="700">VM / vCPU-like context</text><text x="345" y="677" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Owns execution state and lifecycle; currently spread across VM, VMX and lane modules.</text><text x="50" y="722" font-family="Arial,sans-serif" font-size="18" fill="#2363ad" font-weight="700">Executor carrier lane</text><text x="345" y="722" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Host scheduling resource / CPU slot lease. Its role can be Hull, worker or blocking work.</text><text x="50" y="767" font-family="Arial,sans-serif" font-size="18" fill="#2363ad" font-weight="700">CPU SIMD lane</text><text x="345" y="767" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">One element in an AVX/SIMD operation; not a VM identity or scheduling lease.</text><text x="50" y="812" font-family="Arial,sans-serif" font-size="18" fill="#2363ad" font-weight="700">GPU SIMD8 lane</text><text x="345" y="812" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">One data element of an EU instruction. The pixel body calculates eight pixels in parallel.</text><text x="50" y="857" font-family="Arial,sans-serif" font-size="18" fill="#2363ad" font-weight="700">vGPU queue / GPU context</text><text x="345" y="857" font-family="Arial,sans-serif" font-size="17" fill="#30445b" font-weight="400">Virtual admission / completion identity versus physical firmware scheduling context.</text><text x="40" y="929" font-family="Arial,sans-serif" font-size="17" fill="#b47710" font-weight="400">Interpretation: name the logical CPU execution contract explicitly; a new guest-visible vCPU API remains a design choice.</text><path d="M40 951 H1560" stroke="#dce4ec"/><rect x="42" y="970" width="15" height="15" rx="3" fill="#2363ad"/><text x="65" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">CPU / host</text><rect x="220" y="970" width="15" height="15" rx="3" fill="#7551ae"/><text x="243" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Compiler</text><rect x="391" y="970" width="15" height="15" rx="3" fill="#16764d"/><text x="414" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">GPU / driver</text><rect x="590" y="970" width="15" height="15" rx="3" fill="#007e88"/><text x="613" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Memory / data</text><rect x="800" y="970" width="15" height="15" rx="3" fill="#b47710"/><text x="823" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Dashed: proposed or gap</text><rect x="1135" y="970" width="15" height="15" rx="3" fill="#bb3e40"/><text x="1158" y="983" font-family="Arial,sans-serif" font-size="14" fill="#30445b" font-weight="400">Failure / quarantine</text><text x="40" y="1018" font-family="Arial,sans-serif" font-size="13" fill="#30445b" font-weight="400">02 / 06    •    S1–S4, S12 • Conceptual vCPU label describes responsibility, not an existing public Vcpu type.</text><text x="1130" y="1018" font-family="Arial,sans-serif" font-size="13" fill="#30445b" font-weight="400">Code review: 24 Oct 2026 • no new rig run</text></svg>