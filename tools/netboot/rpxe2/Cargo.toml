[package]
name = "rpxe2"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# This is a Linux host application, independent of the no_std kernel workspace.
[workspace]

[dependencies]
anyhow = "1.0"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
nix = { version = "0.31", features = ["signal", "process"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
tokio = { version = "1.54", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "time"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = "symbols"
