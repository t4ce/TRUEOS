<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRUEOS Audio</title>
<style>body{font:1rem system-ui;margin:2rem;max-width:40rem}button{font:inherit;padding:.6rem 1.3rem}label{margin-left:1rem}#status{min-height:1.5em;color:#555}</style>
</head><body><h1>TRUEOS Audio</h1>
<button id="listen" type="button">Listen</button>
<label>Volume <input id="volume" type="range" min="0" max="1" step=".01" value="1"></label>
<label>Crossfade A ↔ B <input id="crossfade" type="range" min="0" max="1" step=".01" value=".5"></label>
<p id="status" role="status">Ready</p>
<script>
const SAMPLE_RATE = 48000;
const FRAME_BYTES = 4;
const BLOCK_FRAMES = 480;
const BLOCK_BYTES = BLOCK_FRAMES * FRAME_BYTES;
const PREFIX_BYTES = 4;
const LEAD_SECONDS = .04;
const QUEUE_SECONDS = .16;

class LivePlayer {
  constructor(report, volume, crossfade) {
    this.report = report;
    this.context = new (window.AudioContext || window.webkitAudioContext)({latencyHint: 'interactive'});
    this.gain = this.context.createGain();
    this.gain.gain.value = volume;
    this.gain.connect(this.context.destination);
    this.lanes = [this.context.createGain(), this.context.createGain()];
    for (const lane of this.lanes) lane.connect(this.gain);
    this.setCrossfade(crossfade);
    // Keep the device running through silence between replies.
    this.silence = this.context.createConstantSource();
    this.silence.offset.value = 0;
    this.silence.connect(this.gain);
    this.silence.start();
    this.abort = new AbortController();
    this.sources = new Set();
    this.nextTime = 0;
  }
  setCrossfade(value) {
    this.lanes[0].gain.value = 1 - value;
    this.lanes[1].gain.value = value;
  }
  delay(ms) {
    const {signal} = this.abort;
    return new Promise(resolve => {
      const finish = () => {
        clearTimeout(timer);
        signal.removeEventListener('abort', finish);
        resolve();
      };
      const timer = setTimeout(finish, ms);
      signal.addEventListener('abort', finish, {once: true});
      if (signal.aborted) finish();
    });
  }
  async start() {
    await this.context.resume();
    const {signal} = this.abort;
    while (!signal.aborted) {
      try {
        const response = await fetch('/audio/live.pcm', {cache: 'no-store', signal});
        if (signal.aborted) return;
        if (!response.ok || !response.body) throw new Error('Audio connection lost');
        await this.readStream(response.body.getReader());
      } catch {
        // A reset, invalid PCM frame count or EOF all need a new live stream.
      }
      if (!signal.aborted) {
        this.report('Reconnecting…');
        await this.delay(500);
      }
    }
  }
  async readStream(reader) {
    const {signal} = this.abort;
    const block = new Uint8Array(PREFIX_BYTES + 2 * BLOCK_BYTES);
    let blockBytes = 0;
    let listening = false;
    try {
      while (!signal.aborted) {
        const {value, done} = await reader.read();
        if (done || signal.aborted) return;
        let offset = 0;
        while (offset < value.length && !signal.aborted) {
          const count = Math.min(block.length - blockBytes, value.length - offset);
          block.set(value.subarray(offset, offset + count), blockBytes);
          blockBytes += count;
          offset += count;
          if (blockBytes < block.length) continue;

          // Stop reading ahead if the browser has accumulated a burst of PCM.
          while (!signal.aborted && this.nextTime > this.context.currentTime + QUEUE_SECONDS) {
            await this.delay(10);
          }
          if (signal.aborted) return;
          this.schedule(block);
          if (!listening) {
            this.report('Listening');
            listening = true;
          }
          blockBytes = 0;
        }
      }
    } finally {
      await reader.cancel().catch(() => {});
      reader.releaseLock();
    }
  }
  schedule(block) {
    const view = new DataView(block.buffer, block.byteOffset, block.byteLength);
    const frames = [view.getUint16(0, true), view.getUint16(2, true)];
    if (frames.some(count => count > BLOCK_FRAMES)) throw new Error('Invalid PCM block');
    const now = this.context.currentTime;
    if (this.nextTime < now + .004) this.nextTime = now + LEAD_SECONDS;
    const when = this.nextTime;
    this.nextTime += BLOCK_FRAMES / SAMPLE_RATE;

    const overlap = Math.min(...frames);
    for (let lane = 0; lane < frames.length; ++lane) {
      const offset = PREFIX_BYTES + lane * BLOCK_BYTES;
      this.scheduleSource(block, view, offset, overlap, when, this.lanes[lane]);
      // A lone producer plays at unity regardless of the crossfade position.
      this.scheduleSource(block, view, offset + overlap * FRAME_BYTES,
        frames[lane] - overlap, when + overlap / SAMPLE_RATE, this.gain);
    }
  }
  scheduleSource(block, view, offset, frames, when, gain) {
    if (!frames || !block.subarray(offset, offset + frames * FRAME_BYTES).some(byte => byte !== 0)) return;
    const buffer = this.context.createBuffer(2, frames, SAMPLE_RATE);
    const left = buffer.getChannelData(0);
    const right = buffer.getChannelData(1);
    for (let frame = 0; frame < frames; ++frame) {
      left[frame] = view.getInt16(offset, true) / 32768;
      right[frame] = view.getInt16(offset + 2, true) / 32768;
      offset += FRAME_BYTES;
    }
    const source = this.context.createBufferSource();
    source.buffer = buffer;
    source.connect(gain);
    source.onended = () => {
      this.sources.delete(source);
      source.disconnect();
    };
    source.start(when);
    this.sources.add(source);
  }
  stop() {
    if (this.abort.signal.aborted) return;
    this.abort.abort();
    for (const source of this.sources) {
      source.onended = null;
      source.stop();
      source.disconnect();
    }
    this.sources.clear();
    this.silence.stop();
    this.context.close().catch(() => {});
  }
}
const button = document.getElementById('listen');
const status = document.getElementById('status');
const volume = document.getElementById('volume');
const crossfade = document.getElementById('crossfade');
let player = null;
button.onclick = async () => {
  if (player) {
    player.stop(); player = null;
    button.textContent = 'Listen'; status.textContent = 'Stopped';
    return;
  }
  let current;
  try {
    current = new LivePlayer(text => { if (player === current) status.textContent = text; }, Number(volume.value), Number(crossfade.value));
    player = current; button.textContent = 'Stop'; status.textContent = 'Starting…';
    await current.start();
  } catch (error) {
    if (current) current.stop();
    if (!current || player === current) {
      player = null; button.textContent = 'Listen'; status.textContent = 'Could not start audio. Click Listen to retry.';
    }
  }
};
volume.oninput = () => { if (player) player.gain.gain.value = Number(volume.value); };
crossfade.oninput = () => { if (player) player.setCrossfade(Number(crossfade.value)); };
window.addEventListener('pagehide', () => { if (player) player.stop(); });
</script></body></html>
