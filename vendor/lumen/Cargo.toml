[package]
name = "lumen"
version = "0.1.5"
edition = "2024"
autobins = false
build = "build.rs"

[features]
default = ["host-runtime", "std", "host-rayon", "cli", "image-io", "model-io"]
host-runtime = [
    "dep:bincode",
    "dep:half",
    "dep:ndarray",
    "dep:ndarray-rand",
    "dep:rand_distr",
    "dep:serde",
    "dep:serde_json",
]
std = ["host-runtime", "ndarray/std", "rand_distr/std", "serde/std", "serde_json/std"]
host-rayon = ["host-runtime", "dep:rayon", "ndarray/rayon"]
cli = ["host-runtime", "dep:mimalloc", "dep:tokenizers", "model-io"]
image-io = ["host-runtime", "dep:image"]
model-io = ["host-runtime", "dep:memmap2", "dep:safetensors"]
dev-tools = []
arm64-int8-kernels = ["host-runtime"]
x86-int8-kernels = ["host-runtime"]
arm64-fp-kernels = ["host-runtime"]
x86-fp-kernels = ["host-runtime"]
cuda = ["host-runtime"]
truega = []

[dependencies]
ndarray = { version = "0.15", default-features = false, optional = true }
ndarray-rand = { version = "0.14", optional = true }
rand_distr = { version = "0.4", default-features = false, features = ["alloc"], optional = true }
rayon = { version = "1.7", optional = true }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"], optional = true }
serde_json = { version = "1.0", default-features = false, features = ["alloc"], optional = true }
bincode = { version = "1.3", optional = true }
image = { version = "0.24", optional = true }
tokenizers = { version = "0.19", optional = true }
safetensors = { version = "0.3", optional = true }
memmap2 = { version = "0.5", optional = true }
half = { version = "2.3", optional = true }
mimalloc = { version = "0.1", optional = true }

[profile.release]
opt-level = 3       # 最高优化等级
lto = true          # 开启链接时优化
panic = "abort"     # 发生 panic 直接终止
strip = true        # 去除符号表

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("trueos", "zkvm"))'] }

[[bin]]
name = "lumen"
path = "src/main.rs"
required-features = ["cli"]

[[bin]]
name = "quantize_safetensors"
path = "src/bin/quantize_safetensors.rs"
required-features = ["model-io"]
