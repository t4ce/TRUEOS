[package]
name = "TRUEOS"
version = "0.0.2"
edition = "2024"
license-file = "LICENSE"

# One lockfile and one dependency resolution for all repository-owned crates.
# Vendored upstream projects and standalone tools intentionally remain outside this
# workspace: several of them define their own workspaces or are independently
# runnable applications.
[workspace]
resolver = "3"
members = [
    "crates/trueos-crypto",
    "crates/trueos-credential-store",
    "crates/trueos-executor",
    "crates/trueos-executor/embassy-time",
    "crates/trueos-executor/trueos-executor-macros",
    "crates/trueos-fs",
    "crates/trueos-gboi",
    "crates/trueos-helio-artifact",
    "crates/trueos-helio-runtime",
    "crates/trueos-io",
    "crates/trueos-kokoro/aot",
    "crates/trueos-kokoro/audio",
    "crates/trueos-kokoro/conv",
    "crates/trueos-kokoro/dispatch",
    "crates/trueos-kokoro/duration",
    "crates/trueos-kokoro/exec",
    "crates/trueos-kokoro/f32",
    "crates/trueos-kokoro/g2p",
    "crates/trueos-kokoro/gemm",
    "crates/trueos-kokoro/layout",
    "crates/trueos-kokoro/lexicon",
    "crates/trueos-kokoro/lstm",
    "crates/trueos-kokoro/memory",
    "crates/trueos-kokoro/resize",
    "crates/trueos-kokoro/scalar",
    "crates/trueos-kokoro/stft",
    "crates/trueos-kokoro/voice",
    "crates/trueos-lfm25-cpu",
    "crates/trueos-lfm25-model",
    "crates/trueos-locale",
    "crates/trueos-math",
    "crates/trueos-ttstt-cpu",
    "crates/trueos-v",
    "crates/trueos-vm",
]
# These are patched or directly used upstream projects.  Keeping them out of the
# TRUEOS workspace preserves their own workspace metadata and lockfile policy.
exclude = [
    "vendor/*",
    # Cargo matches workspace exclusions against package directories, so this
    # nested package needs its own entry.
    "vendor/CrabUSB/usb-host",
    "vendor/tinyaudio",
]

[[bin]]
name = "TRUEOS"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["trueos_lumen", "trueos_h264_encode_stream"]
trueos_lumen = []
trueos_h264_encode_stream = []
trueos_h264_encode_probe = ["trueos_h264_encode_stream"]

[dependencies]
x86_64 = { version = "0.15.5", features = ["memory_encryption"] }
core3 = { version = "0.1.2", default-features = false, features = ["alloc", "utils"] }
spin = "0.10"
atomic-waker = { version = "1.1.2", default-features = false }
trueos-executor = { path = "crates/trueos-executor", default-features = false, features = ["executor-thread", "platform-spin", "trueos-task-profile"] }
embassy-sync = { version = "0.8.0", default-features = false }
trueos-time = { path = "crates/trueos-executor/embassy-time", default-features = false, features = ["tick-hz-1_000"] }
embassy-time-driver = { version = "0.2.2", default-features = false }
embedded-io-async = { version = "0.7.0", default-features = false }
trueos-crypto = { path = "crates/trueos-crypto" }
trueos-credential-store = { path = "crates/trueos-credential-store" }
ed25519-dalek = { version = "2.2", default-features = false, features = ["zeroize"] }
qrcodegen = { package = "qrcodegen-no-heap", version = "1.8.1", default-features = false }
heapless = { version = "0.9", default-features = false }
bytes = { version = "1.11.1", default-features = false }
limine = { version = "0.6", default-features = false }
acpi = { version = "6.1.1", default-features = false, features = ["alloc", "aml"] }
aml = { version = "0.16", default-features = false }
getrandom_02 = { package = "getrandom", version = "0.2", default-features = false, features = ["custom"] }
raw-cpuid = { version = "11", default-features = false }
rand_core = { version = "0.6", default-features = false }
rand_chacha = { version = "0.3", default-features = false }
zeroize = { version = "1", default-features = false, features = ["alloc"] }
libm = { version = "0.2", default-features = false }
half = { version = "2.7.1", default-features = false }
skrifa = { version = "0.44.0", default-features = false, features = ["libm"] }
hashbrown = { version = "0.17.0", default-features = false }
memchr = { version = "2.8.0", default-features = false }
microfont = "3.7.8"
object = { version = "0.39.1", default-features = false, features = ["read_core", "elf"] }
unicode-segmentation = { version = "1", default-features = false }
unicode-width = { version = "0.2.2", default-features = false }
log_os_core = { package = "log-os", path = "../TRUEOS-Blueprints/crates/log-os", default-features = false }
tinyaudio = { path = "vendor/tinyaudio", default-features = false }
alsa = { version = "0.11.0", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["custom-provider", "tls12"] }
rustls-rustcrypto = { version = "0.0.2-alpha", default-features = false, features = ["alloc", "tls12", "zeroize"] }
ring = { version = "=0.17.14", default-features = false }
chacha20poly1305 = { version = "0.10.1", default-features = false }
webpki-roots = { version = "1.0.7", default-features = false }
miniz_oxide = { version = "0.9", default-features = false, features = ["with-alloc"] }
lzma-rust2 = { version = "0.16.2", default-features = false, features = ["encoder"] }
png = { version = "0.18.1", default-features = false }
zune-core = { version = "0.5.1", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false, features = ["x86", "portable_simd"] }
crc32fast = { version = "1.5.0", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
embedded-websocket = { version = "0.9.4", default-features = false }
symphonia-core = { version = "0.5.5", default-features = false }
symphonia-codec-aac = { version = "0.5.5", default-features = false }
smoltcp = { version = "0.13", default-features = false, features = ["alloc", "proto-ipv4", "proto-ipv6", "multicast", "socket-raw", "socket-udp", "socket-tcp", "socket-icmp", "socket-dhcpv4", "medium-ethernet"] }
dma-api = { version = "=0.7.3", default-features = false }
crab-usb = { path = "vendor/CrabUSB/usb-host", default-features = false }
trueos-math = { path = "crates/trueos-math", features = ["alloc"] }
trueos-lfm25-model = { path = "crates/trueos-lfm25-model" }
trueos-lfm25-cpu = { path = "crates/trueos-lfm25-cpu" }
trueos-ttstt-cpu = { path = "crates/trueos-ttstt-cpu" }
trueos-kokoro-aot = { path = "crates/trueos-kokoro/aot" }
trueos-kokoro-audio = { path = "crates/trueos-kokoro/audio" }
trueos-kokoro-conv = { path = "crates/trueos-kokoro/conv" }
trueos-kokoro-exec = { path = "crates/trueos-kokoro/exec" }
trueos-kokoro-f32 = { path = "crates/trueos-kokoro/f32" }
trueos-kokoro-g2p = { path = "crates/trueos-kokoro/g2p" }
trueos-kokoro-gemm = { path = "crates/trueos-kokoro/gemm" }
trueos-kokoro-lexicon = { path = "crates/trueos-kokoro/lexicon" }
trueos-kokoro-duration = { path = "crates/trueos-kokoro/duration" }
trueos-kokoro-dispatch = { path = "crates/trueos-kokoro/dispatch" }
trueos-kokoro-layout = { path = "crates/trueos-kokoro/layout" }
trueos-kokoro-lstm = { path = "crates/trueos-kokoro/lstm" }
trueos-kokoro-memory = { path = "crates/trueos-kokoro/memory" }
trueos-kokoro-resize = { path = "crates/trueos-kokoro/resize" }
trueos-kokoro-scalar = { path = "crates/trueos-kokoro/scalar" }
trueos-kokoro-stft = { path = "crates/trueos-kokoro/stft" }
trueos-kokoro-voice = { path = "crates/trueos-kokoro/voice" }
trueos-fs = { path = "crates/trueos-fs" }
infer = { path = "vendor/infer", default-features = false }
v = { path = "crates/trueos-v" }
trueos-vm = { path = "crates/trueos-vm" }
trueos-locale = { path = "crates/trueos-locale", default-features = false }
trueos-helio-artifact = { path = "crates/trueos-helio-artifact" }
trueos-helio-runtime = { path = "crates/trueos-helio-runtime" }
serde = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
mio = { version = "1.2.0", default-features = false, features = ["os-poll", "net"] }
hyper = { version = "1.9.0", default-features = false, features = ["client", "http1", "server"] }
rdrand = { version = "0.8", default-features = false }
redb = { version = "4.2.0", default-features = false, features = ["experimental-api-5"] }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
strip = true
debug = false
opt-level = 2

[patch.crates-io]
cordyceps = { path = "vendor/cordyceps-0.3.5" }
acpi = { path = "vendor/acpi-6.1.1" }
aml = { path = "vendor/aml-0.16.4" }
png = { path = "vendor/png-0.18.1" }
fdeflate = { path = "vendor/fdeflate-0.3.7" }
simd-adler32 = { path = "vendor/simd-adler32-0.3.8" }
hyper = { path = "vendor/hyper-1.9.0" }
http = { path = "vendor/http-1.4.0" }
http-body = { path = "vendor/http-body-1.0.1" }
httpdate = { path = "vendor/httpdate-1.0.3" }
want = { path = "vendor/want-0.3.1" }
crc32fast = { path = "vendor/crc32fast-1.5.0" }
embedded-websocket = { path = "vendor/embedded-websocket-0.9.4" }
lazy_static = { path = "vendor/lazy_static-1.5.0" }
rustls-rustcrypto = { path = "vendor/rustls-rustcrypto-0.0.2-alpha" }
ring = { path = "vendor/ring-0.17.14" }
mio = { path = "vendor/mio-1.2.0" }
smoltcp = { path = "vendor/smoltcp-0.13.1" }
zune-core = { path = "vendor/zune-core-0.5.1" }
zune-jpeg = { path = "vendor/zune-jpeg-0.5.15" }
dma-api = { path = "vendor/dma-api-0.7.3" }
alsa = { path = "vendor/alsa-0.11.0" }
symphonia-core = { path = "vendor/symphonia-core-0.5.5-trueos" }
symphonia-codec-aac = { path = "vendor/symphonia-codec-aac-0.5.5-trueos" }

[build-dependencies]
sha2 = "=0.10.9"
