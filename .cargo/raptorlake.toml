# Experimental i5-14500T kernel build:
# bash tools/build-safe.sh cargo build --release --locked --config .cargo/raptorlake.toml
# Cargo appends these flags to the normal target flags. Host tools and the UEFI
# loader retain their own targets. Keep output separate from published rig builds.
# Before booting, audit BSP/AP code before enable_sse() and SIMD preservation
# across interrupts/context switches: this enables AVX throughout generated code.
[build]
target-dir = "tgt/raptorlake"

[target.'cfg(target_os = "trueos")']
rustflags = ["-C", "target-cpu=raptorlake"]
