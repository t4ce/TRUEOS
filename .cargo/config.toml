[build]
target-dir = "tgt"
target = ".cargo/x86_64-unknown-trueos.json"

[alias]
# Explicitly opt into the experimental headless KVM platform. The exact target
# runner overrides the normal cargo-run guard and receives the freshly built ELF.
kvm = ["run", "--config", "target.x86_64-unknown-trueos.runner=['sh','tools/kvm/run.sh']"]

[unstable]
build-std = ["core", "compiler_builtins", "alloc", "panic_abort"]
build-std-features = ["compiler-builtins-mem"]
json-target-spec = true

[target.'.cargo/x86_64-unknown-trueos.json']
linker = "rust-lld"
rustflags = [
	"--cfg", "getrandom_backend=\"custom\"",
	"--cfg", "kmod",
	"-L", "native=bld/empty-libs",
	"-C", "link-arg=-Tlinker.ld",
	"-C", "force-frame-pointers=yes"
]

[target.'cfg(target_os = "none")']
rustflags = [
	"--cfg", "getrandom_backend=\"custom\"",
	"-C", "link-arg=-Tlinker.ld",
	"-C", "force-frame-pointers=yes"
]

[target.'cfg(target_os = "trueos")']
# Kernel ELFs require a bootloader; never execute them as host processes.
runner = ["sh", "tools/cargo-run.sh"]
rustflags = [
	"--cfg", "getrandom_backend=\"custom\"",
	"--cfg", "kmod",
	"-L", "native=bld/empty-libs",
	"-C", "link-arg=-Tlinker.ld",
	"-C", "force-frame-pointers=yes"
]

[target.'cfg(target_os = "zkvm")']
rustflags = [
	"--cfg", "getrandom_backend=\"custom\"",
	"-C", "link-arg=-Tlinker.ld",
	"-C", "force-frame-pointers=yes"
]

[env]
# smoltcp generates config.rs at build time. The non-test default for
# IFACE_MAX_ADDR_COUNT is 2, which is not enough for (v6 ll + v6 global + v4).
SMOLTCP_IFACE_MAX_ADDR_COUNT = "4"
